<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Datos del producto</h1>

    <h2 th:text="${product.name}">
        Nombre del producto
    </h2>

    <h3>Descripcion y precio</h3>

    <ul>
        <!-- Mustro la descripcion y el precio del producto seleccionado por su id -->
        <li
        th:text="${product.description + ' - precio:' + product.price + '€ '}">
        </li>
    </ul>

    <br>

    <a th:href="@{/products/list}">Volver a la página lista de productos</a>
</body>
</html>
